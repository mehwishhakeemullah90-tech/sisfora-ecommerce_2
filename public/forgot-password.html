<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Sisfora</title>
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar navbar-sisfora py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand sf-logo-brand" href="/"><img src="/images/brand/sisforaimage.png" alt="Sisfora" class="sf-logo-img"></a>
    </div>
  </nav>

  <main>
    <section class="section" style="min-height:75vh;display:flex;align-items:center;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6 col-xl-5">
            <div class="text-center mb-4">
              <p class="eyebrow">Account Recovery</p>
              <h1 class="section-title mb-1">Forgot Password?</h1>
              <p class="section-subtitle">Enter your email and we'll send you a link to reset your password.</p>
            </div>
            <div class="admin-card p-4 p-md-5">
              <form id="forgotPasswordForm" novalidate>
                <div class="mb-4">
                  <label class="form-label" for="forgotEmail">Email Address</label>
                  <input type="email" id="forgotEmail" name="email" class="form-control" required placeholder="you@example.com" autocomplete="email" />
                </div>
                <div id="forgotError" class="alert alert-danger d-none py-2 small mb-3"></div>
                <div id="forgotSuccess" class="alert alert-success d-none py-2 small mb-3"></div>
                <button type="submit" class="btn btn-sisfora w-100 mb-3" id="forgotBtn">Send Reset Link</button>
              </form>
              <p class="text-center small text-muted mt-3 mb-0">
                Remembered it? <a href="/login" class="sf-link-gold fw-semibold">Back to Sign In</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="sf-footer py-3">
    <div class="container">
      <div class="sf-footer-bottom text-center">
        <span>&copy; 2026 Sisfora. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <div id="sfToast" class="toast-sf"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
