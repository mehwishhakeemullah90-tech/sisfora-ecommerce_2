<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHQGVF2SBW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XHQGVF2SBW');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Product | Sisfora</title>
  <meta name="description" content="Shop luxury cosmetics at Sisfora." />
  <meta name="theme-color" content="#0f0c0a" />
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="sfHeader"></div>
  <script src="/js/site-config.js"></script>
  <script src="/js/layout.js"></script>

  <main>
    <div id="productDetailsPage">

      <section class="section-sm pd-hero-section">
        <div class="container">
          <p class="breadcrumb-sf" id="pdBreadcrumb">
            <a href="/">Home</a> / <a href="/shop">Shop</a>
          </p>
        </div>
      </section>

      <section class="section pt-2 pd-hero-section">
        <div class="container">
          <div class="row g-5">

            <!-- Gallery -->
            <div class="col-lg-6">
              <div class="d-flex gap-2 align-items-start">
                <div class="pd-thumbs-col" id="pdThumbs"></div>
                <div class="flex-grow-1">
                  <div class="product-media position-relative" style="aspect-ratio:1/1;border-radius:12px;overflow:hidden;">
                    <img id="pdMainImage" src="/images/products/placeholder.svg" class="w-100 h-100" style="object-fit:cover;" alt="Product" />
                    <span class="pd-discount-pill d-none" id="pdDiscountBadge"></span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Info (populated by product-details.js) -->
            <div class="col-lg-6" id="pdInfo">
              <div class="sf-skeleton mb-3" style="height:24px;width:40%;"></div>
              <div class="sf-skeleton mb-4" style="height:48px;width:80%;"></div>
              <div class="sf-skeleton mb-3" style="height:20px;width:30%;"></div>
              <div class="sf-skeleton mb-4" style="height:80px;"></div>
              <div class="sf-skeleton" style="height:52px;"></div>
            </div>

          </div>

          <!-- Tabs: description / reviews -->
          <div class="row mt-5">
            <div class="col-12">
              <ul class="nav nav-tabs" id="pdTabs">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pdDescTab">Description</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pdReviewsTab">Reviews</button></li>
              </ul>
              <div class="tab-content pt-4">

                <div class="tab-pane fade show active" id="pdDescTab">
                  <p class="section-subtitle" id="pdDescription"></p>
                  <div id="pdTags" class="mt-3"></div>
                </div>

                <div class="tab-pane fade" id="pdReviewsTab">
                  <div class="row g-5">
                    <div class="col-md-7">
                      <div id="pdReviewsList"><div class="sf-skeleton" style="height:80px;"></div></div>
                    </div>
                    <div class="col-md-5">
                      <div class="admin-card p-4">
                        <h6 class="mb-3">Write a Review</h6>
                        <form id="pdReviewForm">
                          <div class="mb-3">
                            <label class="form-label d-block">Your Rating</label>
                            <div class="star-rating-input">
                              <input type="radio" name="rating" id="star5" value="5"><label for="star5"><i class="bi bi-star-fill"></i></label>
                              <input type="radio" name="rating" id="star4" value="4"><label for="star4"><i class="bi bi-star-fill"></i></label>
                              <input type="radio" name="rating" id="star3" value="3"><label for="star3"><i class="bi bi-star-fill"></i></label>
                              <input type="radio" name="rating" id="star2" value="2"><label for="star2"><i class="bi bi-star-fill"></i></label>
                              <input type="radio" name="rating" id="star1" value="1"><label for="star1"><i class="bi bi-star-fill"></i></label>
                            </div>
                          </div>
                          <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" placeholder="Summarize your experience">
                          </div>
                          <div class="mb-3">
                            <label class="form-label">Comment</label>
                            <textarea name="comment" class="form-control" rows="3" required placeholder="Tell us what you think..."></textarea>
                          </div>
                          <button type="submit" class="btn btn-sisfora w-100">Submit Review</button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>

        </div>
      </section>

      <!-- Related products -->
      <section class="section bg-ivory">
        <div class="container">
          <div class="text-center mb-5">
            <h2 class="section-title">You may also <em>like</em></h2>
          </div>
          <div class="row g-4" id="relatedProductsGrid"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- "Ask a question" form (opened from the product info panel) -->
  <div class="modal fade" id="pdAskModal" tabindex="-1" aria-labelledby="pdAskTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="pdAskForm">
          <div class="modal-header">
            <h5 class="modal-title" id="pdAskTitle">Ask a question</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="small text-muted mb-3">About: <strong id="pdAskProduct"></strong>. We'll reply by email.</p>
            <div class="mb-3">
              <label class="form-label" for="pdAskName">Your name</label>
              <input type="text" class="form-control" id="pdAskName" name="fullName" required autocomplete="name" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="pdAskEmail">Email</label>
              <input type="email" class="form-control" id="pdAskEmail" name="email" required autocomplete="email" />
            </div>
            <div>
              <label class="form-label" for="pdAskMessage">Your question</label>
              <textarea class="form-control" id="pdAskMessage" name="message" rows="4" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-sisfora w-100">Send Question</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="sfFooter"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/product.js"></script>
  <script src="/js/product-details.js"></script>
  <script src="/js/motion.js"></script>
</body>
</html>
