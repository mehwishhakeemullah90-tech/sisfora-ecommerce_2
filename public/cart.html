<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHQGVF2SBW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XHQGVF2SBW');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Cart | Sisfora</title>
  <meta name="description" content="Review and manage your Sisfora shopping cart." />
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="sfHeader"></div>
  <script src="/js/site-config.js"></script>
  <script src="/js/layout.js"></script>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumb-sf"><a href="/">Home</a> / Cart</p>
        <h1 class="section-title mb-0">Your Cart</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="cartPage">

          <!-- Empty state -->
          <div id="cartEmptyState" class="text-center py-5 d-none">
            <i class="bi bi-bag fs-1 text-muted mb-3 d-block"></i>
            <h4 class="mb-2">Your cart is empty</h4>
            <p class="text-muted mb-4">Discover our luxury beauty collection and add your favourites.</p>
            <a href="/shop" class="btn btn-sisfora">Continue Shopping</a>
          </div>

          <!-- Cart content (rendered by cart-page.js) -->
          <div id="cartContent" class="row g-4">
            <div class="col-lg-8">
              <div class="admin-card">
                <div class="card-header-sf d-flex justify-content-between align-items-center">
                  <h5 class="mb-0">Cart Items</h5>
                  <span class="small text-muted" id="cartItemCount"></span>
                </div>
                <div class="table-responsive p-2 p-md-3">
                  <table class="table align-middle mb-0 sf-cart-table">
                    <thead>
                      <tr><th>Product</th><th>Quantity</th><th>Total</th><th><span class="visually-hidden">Remove</span></th></tr>
                    </thead>
                    <tbody id="cartTableBody"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="col-lg-4">
              <div class="admin-card p-4">
                <h5 class="mb-3">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                  <span class="text-muted">Subtotal</span>
                  <span id="cartSubtotal">—</span>
                </div>
                <div class="d-flex justify-content-between mb-2 d-none" id="cartDiscountRow">
                  <span class="text-muted">Discount</span>
                  <span id="cartDiscount" class="text-success"></span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <span class="text-muted">Shipping</span>
                  <span id="cartShipping">Free</span>
                </div>
                <hr />
                <div class="d-flex justify-content-between fw-semibold mb-4">
                  <span>Total</span>
                  <span id="cartTotal">—</span>
                </div>
                <form id="couponForm" class="d-flex gap-2 mb-4">
                  <input type="text" name="code" class="form-control form-control-sm" placeholder="Coupon code" aria-label="Coupon code" required />
                  <button type="submit" class="btn btn-sisfora-outline btn-sm">Apply</button>
                </form>
                <a href="/checkout" class="btn btn-sisfora w-100 mb-3" id="checkoutBtn">Proceed to Checkout</a>
                <a href="/shop" class="btn btn-sisfora-outline w-100">Continue Shopping</a>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <div id="sfFooter" data-newsletter="off"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/cart-page.js"></script>
  <script src="/js/motion.js"></script>
</body>
</html>
