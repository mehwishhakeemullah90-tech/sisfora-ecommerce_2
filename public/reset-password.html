<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Sisfora</title>
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar navbar-sisfora py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand sf-logo-brand" href="/"><img src="/images/brand/sisforaimage.png" alt="Sisfora" class="sf-logo-img"></a>
    </div>
  </nav>

  <main>
    <section class="section" style="min-height:75vh;display:flex;align-items:center;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6 col-xl-5">
            <div class="text-center mb-4">
              <p class="eyebrow">Account Recovery</p>
              <h1 class="section-title mb-1">Set New Password</h1>
              <p class="section-subtitle">Choose a strong new password for your Sisfora account.</p>
            </div>
            <div class="admin-card p-4 p-md-5">
              <form id="resetPasswordForm" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="newPassword">New Password</label>
                  <div class="input-group">
                    <input type="password" id="newPassword" name="password" class="form-control border-end-0" required minlength="6" placeholder="At least 6 characters" />
                    <button class="input-group-text bg-white border-start-0" type="button" id="toggleNewPwd" aria-label="Show password">
                      <i class="bi bi-eye-slash" id="newPwdIcon"></i>
                    </button>
                  </div>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
                  <input type="password" id="confirmNewPassword" name="confirmPassword" class="form-control" required placeholder="Repeat your password" />
                </div>
                <div id="resetError" class="alert alert-danger d-none py-2 small mb-3"></div>
                <div id="resetSuccess" class="alert alert-success d-none py-2 small mb-3"></div>
                <button type="submit" class="btn btn-sisfora w-100" id="resetBtn">Reset Password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="sf-footer py-3">
    <div class="container">
      <div class="sf-footer-bottom text-center">
        <span>&copy; 2026 Sisfora. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <div id="sfToast" class="toast-sf"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('toggleNewPwd').addEventListener('click', function() {
      var input = document.getElementById('newPassword');
      var icon = document.getElementById('newPwdIcon');
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  </script>
</body>
</html>
