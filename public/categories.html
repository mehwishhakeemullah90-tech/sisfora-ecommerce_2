<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHQGVF2SBW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XHQGVF2SBW');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Categories | Sisfora</title>
  <meta name="description" content="Browse Sisfora products by category." />
  <meta name="theme-color" content="#0f0c0a" />
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="sfHeader"></div>
  <script src="/js/site-config.js"></script>
  <script src="/js/layout.js"></script>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumb-sf"><a href="/">Home</a> / <span class="text-dark">Categories</span></p>
        <h1 class="section-title mb-0">Shop by Category</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row g-4" id="categoriesGrid">
          <div class="col-md-6 col-lg-4"><div class="sf-skeleton" style="aspect-ratio:4/3;"></div></div>
          <div class="col-md-6 col-lg-4"><div class="sf-skeleton" style="aspect-ratio:4/3;"></div></div>
          <div class="col-md-6 col-lg-4"><div class="sf-skeleton" style="aspect-ratio:4/3;"></div></div>
        </div>
      </div>
    </section>
  </main>

  <div id="sfFooter"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/motion.js"></script>
  <script>
    // Studio images for categories that still use the old placeholder artwork
    var SF_CATEGORY_ART = { skincare: '/images/sisfora/scene/category-skincare.webp' };
    document.addEventListener('DOMContentLoaded', function() {
      sfFetch('/api/categories').then(function(data) {
        var el = document.getElementById('categoriesGrid');
        var cats = (data && data.categories) || [];
        if (!el) return;
        if (!cats.length) { el.innerHTML = '<div class="col-12"><div class="sf-empty"><h3>New collections coming soon</h3><p>We are preparing something beautiful.</p></div></div>'; return; }
        var col = cats.length === 1 ? 'col-12' : cats.length === 2 ? 'col-md-6' : 'col-md-6 col-lg-4';
        var ratio = cats.length === 1 ? '16/7' : '4/3';
        el.innerHTML = cats.map(function(cat) {
          var img = cat.image && !/\.svg$/.test(cat.image) ? cat.image : (SF_CATEGORY_ART[cat.slug] || cat.image || '/images/products/placeholder.svg');
          return '<div class="' + col + '">' +
            '<a href="/categories/' + cat.slug + '" class="category-tile" data-tilt data-tilt-max="3" data-cursor="Shop">' +
            '<img src="' + img + '" alt="' + sfEscape(cat.name) + '" style="aspect-ratio:' + ratio + ';" />' +
            '<div class="category-tile-overlay"><div>' +
            '<p class="eyebrow eyebrow--light mb-2">' + (cat.productCount ? cat.productCount + ' products' : 'Collection') + '</p>' +
            '<h5>' + sfEscape(cat.name) + '</h5>' +
            '<span class="small" style="color:rgba(246,240,231,.75)">' + sfEscape(cat.description || 'Shop the collection') + '</span>' +
            '</div></div></a></div>';
        }).join('');
        if (window.sfMotionRefresh) window.sfMotionRefresh(el);
      }).catch(function() {});
    });
  </script>
</body>
</html>
