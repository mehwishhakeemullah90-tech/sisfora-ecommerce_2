<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e7e4"/>
      <stop offset="55%" stop-color="#fffaf7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="hjar" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce8ea"/>
    </linearGradient>
    <linearGradient id="hser" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fff9ed"/>
      <stop offset="100%" stop-color="#e8d3a0"/>
    </linearGradient>
    <linearGradient id="hlip" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#2b2422"/>
      <stop offset="100%" stop-color="#1a1512"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#hbg)"/>

  <!-- Decorative blobs -->
  <circle cx="720" cy="180" r="240" fill="#c9a24b" opacity="0.1"/>
  <circle cx="130" cy="740" r="190" fill="#eab8c0" opacity="0.18"/>
  <circle cx="820" cy="700" r="120" fill="#d98fa0" opacity="0.08"/>

  <!-- === Large moisturizer jar (center-left) === -->
  <rect x="200" y="360" width="240" height="185" rx="10" fill="url(#hjar)" stroke="#eab8c0" stroke-width="2"/>
  <rect x="200" y="425" width="240" height="80" rx="0" fill="#eab8c0" opacity="0.2"/>
  <text x="320" y="462" font-family="Georgia,serif" font-size="16" fill="#1a1512" text-anchor="middle" font-weight="bold">SISFORA</text>
  <text x="320" y="482" font-family="Arial,sans-serif" font-size="10" letter-spacing="3" fill="#d98fa0" text-anchor="middle">PURE HYDRA</text>
  <rect x="200" y="328" width="240" height="36" rx="6" fill="#1a1512"/>
  <line x1="218" y1="375" x2="218" y2="532" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.32"/>
  <ellipse cx="320" cy="546" rx="120" ry="16" fill="#d98fa0" opacity="0.12"/>

  <!-- === Serum dropper (right) === -->
  <rect x="540" y="290" width="96" height="230" rx="16" fill="url(#hser)" stroke="#c9a24b" stroke-width="1.8"/>
  <rect x="540" y="370" width="96" height="80" rx="0" fill="#c9a24b" opacity="0.16"/>
  <text x="588" y="408" font-family="Georgia,serif" font-size="11" fill="#1a1512" text-anchor="middle" font-weight="bold">SISFORA</text>
  <text x="588" y="424" font-family="Arial,sans-serif" font-size="7.5" letter-spacing="2" fill="#c9a24b" text-anchor="middle">ROSE SERUM</text>
  <rect x="560" y="240" width="56" height="55" rx="7" fill="#e8d3a0" stroke="#c9a24b" stroke-width="1.2"/>
  <rect x="554" y="208" width="68" height="36" rx="7" fill="#1a1512"/>
  <line x1="555" y1="306" x2="555" y2="506" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.38"/>
  <ellipse cx="588" cy="524" rx="48" ry="9" fill="#c9a24b" opacity="0.12"/>

  <!-- === Lipstick (far right, smaller) === -->
  <rect x="690" y="380" width="52" height="155" rx="5" fill="url(#hlip)"/>
  <rect x="690" y="430" width="52" height="22" rx="0" fill="#c9a24b" opacity="0.6"/>
  <rect x="696" y="312" width="40" height="72" rx="4" fill="#2b2422"/>
  <rect x="700" y="268" width="32" height="48" rx="2" fill="#d98fa0"/>
  <path d="M700 268 Q716 232 732 268" fill="#b06880"/>
  <line x1="698" y1="398" x2="698" y2="518" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <ellipse cx="716" cy="536" rx="26" ry="7" fill="#1a1512" opacity="0.1"/>

  <!-- Floating petals / leaves decoration -->
  <ellipse cx="165" cy="310" rx="28" ry="14" fill="#eab8c0" opacity="0.4" transform="rotate(-35 165 310)"/>
  <ellipse cx="780" cy="245" rx="22" ry="11" fill="#c9a24b" opacity="0.35" transform="rotate(25 780 245)"/>
  <ellipse cx="475" cy="175" rx="18" ry="9" fill="#eab8c0" opacity="0.35" transform="rotate(-15 475 175)"/>
</svg>
