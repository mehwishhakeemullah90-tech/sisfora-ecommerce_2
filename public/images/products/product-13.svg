  <!-- shine -->
  <line x1="270" y1="228" x2="270" y2="495" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.42"/>
  <circle cx="448" cy="160" r="55" fill="#eab8c0" opacity="0.1"/>
  <circle cx="145" cy="530" r="38" fill="#c9a24b" opacity="0.07"/>
  <text x="300" y="592" font-family="Georgia,serif" font-size="20" fill="#1a1512" text-anchor="middle">Rosewater Toner</text>
  <text x="300" y="616" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#d98fa0" text-anchor="middle">SKINCARE · TONER</text>
