<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7e7e4"/><stop offset="100%" stop-color="#fffaf7"/></linearGradient>
    <linearGradient id="ton13" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#fff0f0"/><stop offset="100%" stop-color="#f7d8d8"/></linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg13)"/>
  <ellipse cx="300" cy="620" rx="80" ry="11" fill="#d98fa0" opacity="0.14"/>
