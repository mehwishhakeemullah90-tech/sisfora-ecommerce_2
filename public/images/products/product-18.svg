  <text x="300" y="400" font-family="Georgia,serif" font-size="13" fill="#1a1512" text-anchor="middle" font-weight="bold">SISFORA</text>
  <text x="300" y="418" font-family="Arial,sans-serif" font-size="7.5" letter-spacing="2" fill="#d98fa0" text-anchor="middle">PETAL SOFT</text>
  <text x="300" y="433" font-family="Arial,sans-serif" font-size="7.5" letter-spacing="2" fill="#d98fa0" text-anchor="middle">CLEANSER</text>
  <!-- pump neck wider -->
