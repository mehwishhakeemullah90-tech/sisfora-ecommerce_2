  <circle cx="455" cy="160" r="54" fill="#eab8c0" opacity="0.1"/>
  <text x="300" y="592" font-family="Georgia,serif" font-size="20" fill="#1a1512" text-anchor="middle">Petal Soft Cream Cleanser</text>
