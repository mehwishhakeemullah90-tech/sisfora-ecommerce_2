<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fdf8ee"/><stop offset="100%" stop-color="#fffaf7"/></linearGradient>
    <linearGradient id="pfm10" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#fff9ed"/><stop offset="50%" stop-color="#e8d3a0"/><stop offset="100%" stop-color="#c9a24b"/></linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg10)"/>
  <ellipse cx="300" cy="616" rx="100" ry="13" fill="#c9a24b" opacity="0.18"/>
  <!-- perfume bottle body (rounded rectangular) -->
  <rect x="236" y="250" width="128" height="240" rx="22" fill="url(#pfm10)" stroke="#c9a24b" stroke-width="2"/>
  <!-- label -->
  <rect x="252" y="335" width="96" height="90" rx="4" fill="rgba(255,255,255,0.45)"/>
  <text x="300" y="372" font-family="Georgia,serif" font-size="13" fill="#1a1512" text-anchor="middle" font-weight="bold">SISFORA</text>
  <text x="300" y="390" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.5" fill="#1a1512" text-anchor="middle">AMBER BLOOM</text>
  <text x="300" y="406" font-family="Arial,sans-serif" font-size="7" letter-spacing="2" fill="#c9a24b" text-anchor="middle">EAU DE PARFUM</text>
  <!-- neck -->
  <rect x="272" y="196" width="56" height="58" rx="8" fill="#e8d3a0" stroke="#c9a24b" stroke-width="1.5"/>
  <!-- cap -->
  <rect x="264" y="158" width="72" height="42" rx="8" fill="#1a1512"/>
  <!-- atomiser spray top -->
  <rect x="295" y="140" width="10" height="22" rx="3" fill="#c9a24b"/>
  <circle cx="300" cy="136" r="7" fill="#c9a24b"/>
  <!-- shine -->
  <line x1="250" y1="268" x2="250" y2="475" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <circle cx="460" cy="152" r="58" fill="#c9a24b" opacity="0.1"/>
  <text x="300" y="590" font-family="Georgia,serif" font-size="20" fill="#1a1512" text-anchor="middle">Amber Bloom Eau de Parfum</text>
  <text x="300" y="614" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#c9a24b" text-anchor="middle">FRAGRANCE · EDP</text>
</svg>
