<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf5f5"/>
      <stop offset="100%" stop-color="#fffaf7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg2)"/>
  <ellipse cx="300" cy="622" rx="90" ry="11" fill="#d98fa0" opacity="0.15"/>
  <!-- lipstick tube base -->
  <rect x="265" y="375" width="70" height="175" rx="6" fill="#1a1512"/>
  <!-- gold band -->
  <rect x="265" y="432" width="70" height="28" rx="0" fill="#c9a24b" opacity="0.75"/>
  <!-- bullet holder -->
  <rect x="272" y="295" width="56" height="85" rx="4" fill="#2b2422"/>
  <!-- lipstick bullet -->
  <rect x="276" y="235" width="48" height="65" rx="2" fill="#d98fa0"/>
  <path d="M276 235 Q300 195 324 235" fill="#b06880"/>
  <!-- shine on bullet -->
  <rect x="281" y="240" width="8" height="45" rx="4" fill="white" opacity="0.3"/>
  <!-- shine on tube -->
  <line x1="278" y1="400" x2="278" y2="530" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
  <!-- label on tube -->
  <text x="300" y="494" font-family="Arial,sans-serif" font-size="8" fill="#c9a24b" text-anchor="middle" letter-spacing="2">SISFORA</text>
  <!-- decorative circles -->
  <circle cx="155" cy="185" r="60" fill="#eab8c0" opacity="0.1"/>
  <circle cx="455" cy="500" r="45" fill="#c9a24b" opacity="0.08"/>
  <!-- footer label -->
  <text x="300" y="592" font-family="Georgia,serif" font-size="22" fill="#1a1512" text-anchor="middle">Velvet Matte Lipstick</text>
  <text x="300" y="616" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#d98fa0" text-anchor="middle">MAKEUP · LIP COLOUR</text>
</svg>
