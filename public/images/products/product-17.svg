<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0f8fc"/><stop offset="100%" stop-color="#fffaf7"/></linearGradient>
    <linearGradient id="tub17" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#ddeffc"/><stop offset="100%" stop-color="#b8d8ef"/></linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg17)"/>
  <ellipse cx="300" cy="620" rx="90" ry="11" fill="#6aacce" opacity="0.14"/>
  <!-- SPF tube (squeezable flat tube) -->
  <rect x="245" y="230" width="110" height="300" rx="12" fill="url(#tub17)" stroke="#6aacce" stroke-width="1.8"/>
  <!-- label band -->
  <rect x="245" y="330" width="110" height="100" rx="0" fill="rgba(255,255,255,0.35)"/>
  <text x="300" y="368" font-family="Georgia,serif" font-size="11" fill="#1a1512" text-anchor="middle" font-weight="bold">SISFORA</text>
  <text x="300" y="385" font-family="Arial,sans-serif" font-size="7.5" letter-spacing="2" fill="#1a7fae" text-anchor="middle">SUNLIT GLOW</text>
  <text x="300" y="400" font-family="Arial,sans-serif" font-size="8" letter-spacing="1" fill="#1a1512" text-anchor="middle" font-weight="bold">SPF 30</text>
  <!-- tube cap (flip-top) -->
  <rect x="258" y="190" width="84" height="44" rx="10" fill="#6aacce"/>
  <rect x="266" y="198" width="68" height="24" rx="6" fill="#4a92be"/>
  <!-- crimped bottom -->
  <rect x="250" y="508" width="100" height="24" rx="4" fill="#88bbd8" opacity="0.6"/>
  <!-- shine -->
  <line x1="258" y1="248" x2="258" y2="498" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.42"/>
  <circle cx="460" cy="158" r="52" fill="#6aacce" opacity="0.1"/>
  <text x="300" y="592" font-family="Georgia,serif" font-size="19" fill="#1a1512" text-anchor="middle">Sunlit Glow SPF 30</text>
  <text x="300" y="616" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#1a7fae" text-anchor="middle">SKINCARE · SUNSCREEN</text>
</svg>
