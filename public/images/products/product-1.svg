<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e7e4"/>
      <stop offset="100%" stop-color="#fffaf7"/>
    </linearGradient>
    <linearGradient id="bottle1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fce8ea"/>
      <stop offset="100%" stop-color="#eab8c0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg1)"/>
  <!-- shadow -->
  <ellipse cx="300" cy="620" rx="120" ry="14" fill="#d98fa0" opacity="0.15"/>
  <!-- dropper bottle body -->
  <rect x="245" y="260" width="110" height="240" rx="18" fill="url(#bottle1)" stroke="#d98fa0" stroke-width="1.5"/>
  <!-- label band -->
  <rect x="245" y="350" width="110" height="90" rx="0" fill="#d98fa0" opacity="0.18"/>
  <!-- label text -->
  <text x="300" y="393" font-family="Georgia,serif" font-size="13" fill="#1a1512" text-anchor="middle" font-weight="bold">SISFORA</text>
  <text x="300" y="410" font-family="Arial,sans-serif" font-size="9" letter-spacing="3" fill="#d98fa0" text-anchor="middle">ROSE RADIANCE</text>
  <!-- neck -->
  <rect x="275" y="210" width="50" height="55" rx="8" fill="#eab8c0" stroke="#d98fa0" stroke-width="1.2"/>
  <!-- dropper cap -->
  <rect x="282" y="170" width="36" height="45" rx="6" fill="#1a1512"/>
  <!-- shine line -->
  <line x1="258" y1="280" x2="258" y2="480" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- floating botanicals -->
  <circle cx="460" cy="160" r="55" fill="#eab8c0" opacity="0.12"/>
  <circle cx="140" cy="520" r="40" fill="#c9a24b" opacity="0.1"/>
  <!-- category tag -->
  <text x="300" y="590" font-family="Georgia,serif" font-size="22" fill="#1a1512" text-anchor="middle">Rose Radiance Serum</text>
  <text x="300" y="614" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#d98fa0" text-anchor="middle">SKINCARE · SERUM</text>
</svg>
