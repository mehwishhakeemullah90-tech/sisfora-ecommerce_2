<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Sisfora</title>
  <meta name="description" content="Complete your Sisfora order." />
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar navbar-sisfora py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand sf-logo-brand" href="/"><img src="/images/brand/sisforaimage.png" alt="Sisfora" class="sf-logo-img"></a>
      <div class="d-flex align-items-center gap-3 small text-muted">
        <span><i class="bi bi-lock-fill me-1 text-gold"></i>Secure Checkout</span>
      </div>
    </div>
  </nav>

  <main id="checkoutPage">
    <section class="section">
      <div class="container">
        <div class="row g-4">

          <!-- Left: Shipping + Payment -->
          <div class="col-lg-7">
            <!-- Shipping Address -->
            <div class="admin-card p-4 mb-4">
              <div class="card-header-sf mb-3 pb-2 px-0">
                <h5 class="mb-0">Shipping Address</h5>
              </div>
              <form id="checkoutForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="shippingName">Full Name</label>
                    <input type="text" id="shippingName" name="name" class="form-control" required placeholder="Jane Smith" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="shippingPhone">Phone Number</label>
                    <input type="tel" id="shippingPhone" name="phone" class="form-control" required placeholder="+92 300 1234567" />
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="shippingAddress">Street Address</label>
                    <input type="text" id="shippingAddress" name="address" class="form-control" required placeholder="House no., street, area" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="shippingCity">City</label>
                    <input type="text" id="shippingCity" name="city" class="form-control" required placeholder="Lahore" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="shippingPostalCode">Postal Code</label>
                    <input type="text" id="shippingPostalCode" name="postalCode" class="form-control" placeholder="54000" />
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="shippingCountry">Country</label>
                    <select id="shippingCountry" name="country" class="form-select">
                      <option value="Pakistan" selected>Pakistan</option>
                      <option value="United Kingdom">United Kingdom</option>
                      <option value="United States">United States</option>
                    </select>
                  </div>
                </div>
              </form>
            </div>

            <!-- Payment -->
            <div class="admin-card p-4">
              <div class="card-header-sf mb-3 pb-2 px-0">
                <h5 class="mb-0">Payment</h5>
                <span class="small text-muted"><i class="bi bi-lock-fill me-1"></i>Encrypted &amp; Secure</span>
              </div>
              <div id="paymentElement" class="mb-3">
                <!-- Stripe Payment Element mounted here by checkout.js -->
                <div class="sf-skeleton" style="height:50px;border-radius:4px;"></div>
              </div>
              <div id="checkoutError" class="alert alert-danger d-none py-2 small mt-3"></div>
            </div>
          </div>

          <!-- Right: Order Summary -->
          <div class="col-lg-5">
            <div class="admin-card p-4">
              <h5 class="mb-3">Order Summary</h5>
              <div id="checkoutOrderItems">
                <div class="sf-skeleton mb-2" style="height:56px;"></div>
                <div class="sf-skeleton mb-2" style="height:56px;"></div>
              </div>
              <hr />
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span id="checkoutSubtotal">—</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Shipping</span>
                <span id="checkoutShipping">Free</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fw-semibold fs-5 mb-4">
                <span>Total</span>
                <span id="checkoutTotal">—</span>
              </div>
              <button type="button" class="btn btn-sisfora w-100" id="placeOrderBtn" disabled>
                <span id="placeOrderSpinner" class="d-none spinner-border spinner-border-sm me-2" role="status"></span>
                Place Order
              </button>
              <p class="small text-muted text-center mt-3 mb-0">
                By placing your order, you agree to our <a href="/terms">Terms &amp; Conditions</a>.
              </p>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="sf-footer py-3">
    <div class="container">
      <div class="sf-footer-bottom d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <span>&copy; 2026 Sisfora. All rights reserved.</span>
        <div class="d-flex gap-4 small">
          <a href="/privacy-policy">Privacy</a>
          <a href="/terms">Terms</a>
        </div>
      </div>
    </div>
  </footer>

  <div id="sfToast" class="toast-sf"></div>
  <script src="https://js.stripe.com/v3/" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
