<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHQGVF2SBW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XHQGVF2SBW');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wishlist | Sisfora</title>
  <meta name="description" content="Your saved Sisfora favourites." />
  <meta name="theme-color" content="#0f0c0a" />
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="sfHeader"></div>
  <script src="/js/site-config.js"></script>
  <script src="/js/layout.js"></script>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumb-sf mb-2"><a href="/">Home</a> / <span class="text-dark">Wishlist</span></p>
        <h1 class="section-title mb-0">Your Wishlist</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <p class="text-muted small mb-4" id="wishlistNote"></p>
        <div class="row g-4" id="wishlistPageGrid"></div>
      </div>
    </section>
  </main>

  <div id="sfFooter" data-newsletter="off"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/product.js"></script>
  <script src="/js/motion.js"></script>
  <script>
    // Shows the account wishlist when signed in, otherwise the one saved in this browser
    async function sfRenderWishlistPage() {
      var grid = document.getElementById('wishlistPageGrid');
      var note = document.getElementById('wishlistNote');
      var products = [];
      var signedIn = true;
      try {
        products = (await sfFetch('/api/users/wishlist')).wishlist || [];
      } catch (err) {
        signedIn = false;
        var ids = sfGetGuestWishlist();
        if (ids.length) products = (await sfFetch('/api/products/by-ids?ids=' + ids.join(','))).products || [];
      }

      note.innerHTML = signedIn
        ? ''
        : 'Saved in this browser. <a href="/login?redirect=/wishlist">Sign in</a> to keep your wishlist on all your devices.';

      if (!products.length) {
        grid.innerHTML = '<div class="col-12 text-center py-5">' +
          '<i class="bi bi-heart fs-1 text-muted"></i>' +
          '<h5 class="mt-3 mb-2">Your wishlist is empty</h5>' +
          '<p class="text-muted mb-4">Tap the heart on any product to save it here.</p>' +
          '<a href="/shop" class="btn btn-sisfora">Discover Products</a></div>';
        return;
      }
      sfRenderProductGrid(grid, products);
    }

    document.addEventListener('DOMContentLoaded', function () {
      sfSkeletonGrid(document.getElementById('wishlistPageGrid'), 4);
      sfRenderWishlistPage();
    });
  </script>
</body>
</html>
