<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHQGVF2SBW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XHQGVF2SBW');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Contact Us | Sisfora</title>
  <meta name="description" content="Get in touch with the Sisfora team." />
  <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="sfHeader"></div>
  <script src="/js/site-config.js"></script>
  <script src="/js/layout.js"></script>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumb-sf"><a href="/">Home</a> / <span class="text-dark">Contact</span></p>
        <h1 class="section-title mb-0">Get In Touch</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-5">
            <h3 class="mb-4">Contact Information</h3>
            <div class="d-flex gap-3 mb-4">
              <i class="bi bi-geo-alt fs-5 text-gold flex-shrink-0 mt-1"></i>
              <div>
                <strong>Our Studio</strong><br>
                <span class="text-muted small">Lahore, Pakistan</span>
              </div>
            </div>
            <div class="d-flex gap-3 mb-4">
              <i class="bi bi-envelope fs-5 text-gold flex-shrink-0 mt-1"></i>
              <div>
                <strong>Email Us</strong><br>
                <a href="mailto:hello@sisfora.com" class="text-muted small js-site-email">hello@sisfora.com</a>
              </div>
            </div>
            <div class="d-flex gap-3 mb-4">
              <i class="bi bi-telephone fs-5 text-gold flex-shrink-0 mt-1"></i>
              <div>
                <strong>Call Us</strong><br>
                <span class="text-muted small js-site-phone">+92 300 1234567</span>
              </div>
            </div>
            <div class="d-flex gap-3 mb-4">
              <i class="bi bi-clock fs-5 text-gold flex-shrink-0 mt-1"></i>
              <div>
                <strong>Business Hours</strong><br>
                <span class="text-muted small">Mon–Sat: 9am – 6pm PKT</span>
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <a href="#" class="social-icon" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
              <a href="#" class="social-icon" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
              <a href="#" class="social-icon" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="admin-card p-4 p-md-5">
              <h4 class="mb-4">Send Us a Message</h4>
              <form id="contactForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Your Name</label>
                    <input type="text" name="name" class="form-control" required placeholder="Jane Smith" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="jane@example.com" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Subject</label>
                    <select name="subject" class="form-select">
                      <option value="">Select a topic...</option>
                      <option>Order Enquiry</option>
                      <option>Product Question</option>
                      <option>Returns &amp; Exchanges</option>
                      <option>Wholesale / Collaboration</option>
                      <option>Other</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Message</label>
                    <textarea name="message" class="form-control" rows="5" required placeholder="How can we help you?"></textarea>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-sisfora w-100" id="contactSubmitBtn">Send Message</button>
                    <div id="contactSuccess" class="alert alert-success mt-3 d-none">Thank you! We'll get back to you within 24 hours.</div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="sfFooter" data-newsletter="off"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/motion.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('contactSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        var data = new FormData(this);
        var body = { name: data.get('name'), email: data.get('email'), subject: data.get('subject'), message: data.get('message') };
        await sfFetch('/api/contact', { method: 'POST', body: JSON.stringify(body) });
        document.getElementById('contactSuccess').classList.remove('d-none');
        this.reset();
      } catch (err) {
        document.getElementById('contactSuccess').classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Message';
      }
    });
  </script>
</body>
</html>
